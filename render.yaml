services:
  - type: web
    name: campus-echo
    runtime: node
    plan: starter
    region: singapore
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/healthz
