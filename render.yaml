services:
  - type: web
    name: campus-echo
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npx --yes --package=pnpm@11.25.0 -c 'pnpm install --frozen-lockfile && pnpm build'
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
